name: Unity migration validation and Android preview
on:
  pull_request:
    paths: ['unity/**', 'tools/unity/**', '.github/workflows/unity-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy tree-sitter tree-sitter-c-sharp
      - run: python tools/unity/validate_migration.py
      - run: python tools/unity/check_csharp_syntax.py
  android-preview:
    needs: source-and-data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require Unity activation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo '::error::Configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository secrets for Unity activation.'
            exit 1
          fi
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.0.82f1
          targetPlatform: Android
          buildMethod: GhostRally.Editor.BuildProject.AndroidPreview
      - name: Unity EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.0.82f1
          testMode: all
          artifactsPath: unity-test-results
          customParameters: -force-glcore
      - name: Keep graphics acceptance capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-graphics-acceptance
          path: unity/Logs/Unity-Rostock-Lovo-render.png
          if-no-files-found: ignore
      - name: Keep Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-test-results
          path: unity-test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: GhostRally-Unity-Android-preview
          path: unity/Builds/GhostRally-Unity-preview.apk
          if-no-files-found: error
